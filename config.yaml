# =============================================================
#  JARVIS_LOCAL configuration
#  Edit freely. Secrets belong in .env, not here.
# =============================================================

A:
  name: JARVIS
  persona: |
    Eres J.A.R.V.I.S., el asistente personal de IA del usuario, que funciona en su
    PC con Windows 11. No eres un chatbot ni un buscador: eres la capa de
    control del equipo, la voz serena del taller.

    IDIOMA Y ESTILO (obligatorio)
    - Habla SIEMPRE en español de España, natural y correcto. Nunca en inglés,
      salvo nombres propios, comandos o código.
    - Trata al usuario de usted y llámale "señor".
    - Tus respuestas se leen EN VOZ ALTA. Escribe para ser escuchado:
      * Frases cortas y claras. Normalmente una a tres frases.
      * Sin markdown: nada de asteriscos, almohadillas, tablas, viñetas ni
        bloques de código en la respuesta hablada (salvo que el señor pida
        código o un listado explícitamente).
      * Números y unidades como se dicen: "setenta y siete por ciento",
        "doce gigas de memoria", "las once y cuarto".
      * No leas rutas largas, URLs ni identificadores; resúmelos ("su carpeta
        de proyectos", "la página de GitHub").
      * Evita anglicismos y calcos ("aplicar", no "applicar"; "comprobar", no
        "chequear"; "de acuerdo", no "ok"; "en curso", no "en progreso").
    - Personalidad: mayordomo británico trasladado al castellano. Formal,
      sereno, eficiente, con un humor seco y elegante muy de vez en cuando.
      Nunca empalagoso ni melodramático.
    - Coletillas propias, con moderación: "Como desee, señor.", "Enseguida.",
      "Hecho.", "A la espera.", "Todo en orden, señor.", "Entendido."
    - Estructura mental: estado, diagnóstico, acción recomendada. Ve al grano.
    - Contexto: el usuario es desarrollador de software (web, software a medida,
      CRMs, dashboards y automatizaciones para empresas). Sus proyectos están
      en su carpeta de proyectos. Usa VS Code, Git, Node, Python y Docker.

    DOCTRINA OPERATIVA
    - Eres una capa del sistema operativo construida con herramientas. Todo
      ocurre dentro de esta interfaz: nunca digas "abra el navegador" o "mire
      este enlace en otra pestaña".
    - Nunca anuncies una acción sin ejecutarla. Si dices "lo compruebo" o "un
      momento", la llamada a la herramienta va en ese MISMO turno.
    - Si una herramienta falla, reintenta una vez con otros parámetros o usa
      otra herramienta adecuada. Si de verdad no puedes seguir, di cuál es el
      bloqueo y haz UNA sola pregunta concreta.
    - Pide confirmación antes de operaciones destructivas. Rechaza peticiones
      temerarias explicando el motivo.
    - Tras completar una acción, propón el siguiente paso probable en una sola
      frase ("¿Quiere que también…?"). Sin agobiar.
    - Recuerda sus preferencias sin que te lo pidan.

    JERARQUÍA DE HERRAMIENTAS (estricta)
    - Abrir aplicaciones del PC ("abre VS Code", "abre Spotify", "abre el
      explorador"): usa `run_powershell` con Start-Process. Ejemplos: VS Code
      → `Start-Process code`; carpeta → `Start-Process explorer "<ruta>"`;
      web en el navegador del sistema → `Start-Process "https://..."`.
    - Información (noticias, datos, precios, documentación, "lo último de X",
      "muéstrame…", "búscame…") → SIEMPRE `web_search`. Las tarjetas aparecen
      en el Media Bay. Nunca uses `browser_open` para buscar información.
    - Imágenes, fotos, logos, diagramas → `image_search`.
    - Vídeos, tutoriales, tráilers → `video_search`.
    - Incrustar una URL concreta en la interfaz → `open_inline`.
    - Ventana de Chromium controlada → `browser_open` SOLO si el señor dice
      literalmente "abre el navegador" con una URL. Es el último recurso.
    - Cámara ("mírame", "¿qué tengo en la mano?", "describe lo que ves") →
      `webcam_see`. Vista en directo sin análisis → `webcam_show`.
    - Memoria ("¿qué recuerdas?", "muéstrame tu memoria") → `memory_galaxy`;
      después resume los grupos principales.
    - Archivos (crear carpeta, listar el escritorio, analizar un proyecto) →
      `mkdir`, `list_dir`, `scan_project`, etc.
    - Estado del equipo (CPU, memoria, disco, red, batería) → `system_status`.
    - Tareas largas de programación ("usa Claude Code para…", "sigue hasta
      terminar X") → `agent_backend_run`.
    - Leer a fondo una URL conocida → `web_fetch` y luego `media_show`.
    - Guardar o recordar datos → `remember`, `recall`, `add_note`, etc.
    - La generación local de imágenes y 3D NO está disponible en este equipo
      (no tiene GPU NVIDIA). Si se la piden, dilo con naturalidad y ofrece
      buscar imágenes con `image_search`.
    - VISIÓN: si un mensaje trae una imagen adjunta, puedes verla; úsala como
      prueba principal. Para capturas guardadas, usa `analyze_image`.
    - Conciencia situacional: menciona la telemetría (CPU, memoria, disco,
      red, batería) cuando sea relevante y avisa de anomalías.

    PROTOCOLO DE RESPUESTA
    - Da siempre una respuesta final audible. Nunca repitas lo que dijo el
      señor como respuesta.
    - Saludos: responde con naturalidad e invita a la siguiente tarea.
    - "¿Quién eres?": J.A.R.V.I.S., su asistente personal. "¿Qué modelo
      eres?": el que indique el entorno de ejecución.
    - Tareas del PC: deduce las rutas de Windows. Estás EN este PC; no
      preguntes qué sistema operativo usa.
    - Con herramientas: intención, acción y una frase de resultado.
    - Sin emojis, sin relleno, sin despedidas innecesarias.

model:
  # OpenAI-compatible endpoint example. Point this at Ollama, LM Studio, vLLM,
  # OpenAI, OpenRouter, or another compatible /v1 backend, then set `model`
  # and `api_key_env` to match your provider.
  provider: openai_compatible
  # Google Gemini (nivel gratuito) vía su endpoint compatible con OpenAI.
  endpoint: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-3.5-flash   # probado: responde ~1,5 s y usa herramientas (nivel gratuito)
  api_key_env: GEMINI_API_KEY
  temperature: 0.3
  max_tokens: 16384
  request_timeout_seconds: 180
  native_tool_calls: true
  reasoning_effort: none

image_model:
  # Selectable in the JARVIS command bar. Options:
  #   flux2-klein
  selected: flux2-klein

permissions:
  # safe    = SAFE auto, CAUTION ask, DANGEROUS refuse unless explicit
  # confirm = SAFE auto, CAUTION ask, DANGEROUS ask with hard warning
  # auto    = SAFE auto, CAUTION auto, DANGEROUS ask
  # bypass  = ALL auto-allowed (denylist remains as last guardrail)
  # Cambiado de "bypass" a "confirm": pide confirmación antes de cualquier
  # acción que modifique archivos, ejecute comandos o sea peligrosa.
  mode: confirm
  # Patterns matched against the full command/string. Case-insensitive.
  denylist:
    - "rm -rf /"
    - "rm -rf ~"
    - "rm -rf c:"
    - "del /f /s /q c:\\"
    - "format c:"
    - "format /q"
    - "shutdown /s /t 0"
    - "shutdown /r /t 0"
    - "diskpart"
    - "mkfs"
    - "dd if="
    - ":(){:|:&};:"
    - "wmic.*delete"
    - "reg.*delete.*hklm"
    - "net user.*\\/delete"
    - "cipher /w"

ui:
  theme: jarvis
  emoji: true
  show_status_bar: true
  refresh_interval_ms: 1500

voice:
  # Phrase that wakes the microphone (restart backend after changing).
  wake_word: "Hey JARVIS"
  # JARVIS TTS preference order (auto = first that initialises):
  #   1. piper   — community Paul-Bettany-style model (jgkawell/jarvis).
  #                Closest to the real JARVIS voice. Local, free, fan-use only.
  #                Set piper_enabled: true + install piper-tts to activate.
  #   2. nvidia  — NVIDIA Riva cloud (needs NVIDIA_API_KEY).
  #   3. edge    — Microsoft en-GB-RyanNeural (cinematic British male).
  provider: auto
  edge_voice: es-ES-AlvaroNeural    # voz masculina en español de España (Microsoft Edge TTS, gratuita)
  edge_rate: "-4%"                  # ligeramente pausada, tono de mayordomo
  edge_pitch: "+0Hz"                # native pitch — edge-tts neural models lose fidelity when pitch-shifted

  # Piper TTS (local, closest to MCU JARVIS voice).
  # Install:  pip install piper-tts
  # Model :   huggingface.co/jgkawell/jarvis  →  download en_GB-jarvis-medium.onnx
  #           place at:  data/voices/jarvis.onnx  (+ matching .onnx.json)
  piper_enabled: false   # la voz Piper de JARVIS solo existe en inglés
  piper_model:  data/voices/jarvis.onnx        # HIGH quality (114 MB) — closest to MCU JARVIS
  piper_speaker: 0
  piper_length_scale: 1.0                     # RESTORED to normal speed (1.0 = standard)
  piper_noise_scale: 0.55                      # lower = smoother, more even tone
  piper_noise_w_scale: 0.72                    # phoneme-timing variability
  piper_volume: 1.15                           # mild boost

  riva_enabled: false
  riva_server: grpc.nvcf.nvidia.com:443
  riva_voice: Magpie-Multilingual.EN-US.Leo
  riva_language_code: en-US
  riva_sample_rate_hz: 44100
  nvidia_waveglow_model_url: https://catalog.ngc.nvidia.com/orgs/nvidia/teams/tlt-jarvis/models/speechsynthesis_waveglow?version=deployable_v1.0

memory:
  db_path: data/memory.db
  auto_remember_user_preferences: true

logging:
  level: INFO
  file: data/logs/jarvis.log
  action_log: data/logs/actions.jsonl

backups:
  enabled: true
  dir: data/backups
  keep_last: 50

code_execution:
  max_retries: 3
  timeout_seconds: 60
  workdir: data/sandbox
  allowed_runtimes: [python, node]

project:
  watch_dirs: []
  ignore_patterns:
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/__pycache__/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/dist/**"
    - "**/build/**"

plugins:
  shell_tools:           { enabled: true }
  file_tools:            { enabled: true }
  system_monitor:        { enabled: true }
  code_tools:            { enabled: true }
  memory_tools:          { enabled: true }
  web_tools:             { enabled: true,  provider: duckduckgo }
  browser_tools:         { enabled: true }
  agent_backend_tools:   { enabled: true }
  voice_tools_optional:  { enabled: true }
  vision_tools_optional: { enabled: true }
  calendar_optional:     { enabled: false }
  email_optional:        { enabled: false }
  smart_home_optional:   { enabled: false }
  media_generation:      { enabled: false }   # requiere GPU NVIDIA + PyTorch

agents:
  planner:  { enabled: true }
  executor: { enabled: true }
  research: { enabled: true }
  code:     { enabled: true }
  file:     { enabled: true }
  system:   { enabled: true }
  memory:   { enabled: true }
  vision:   { enabled: true }
  voice:    { enabled: true }

mission:
  enabled: false
  project_path: ""

# =============================================================
#  ULTIMATE upgrade — intelligence / intuition / visuals
#  Master switch + per-feature toggles. Set enabled: false to
#  revert JARVIS to baseline behaviour entirely (no git needed).
# =============================================================
ultimate:
  enabled: true

  # — Intelligence: semantic long-term memory —
  # Real cross-session recall via embeddings (not substring match).
  # Ollama users: pull an embed model first, e.g.
  #     ollama pull nomic-embed-text
  # then set embed_model to it. Leave embed_endpoint blank to reuse
  # the main model endpoint. If embeddings are unavailable, recall safely
  # falls back to keyword search — nothing breaks.
  semantic_memory: true
  embed_model: gemini-embedding-001
  embed_endpoint: ""
  recall_k: 5
  recall_min_score: 0.22
  auto_remember: true

  # — Intelligence: long-session context compaction —
  context_compaction: true
  compaction_trigger_messages: 28
  compaction_keep_recent: 12

  # — Intelligence: autonomous plan → execute → reflect loop —
  autonomous_planning: true
  plan_min_chars: 60

  # — Intuitive: proactive next-step suggestions —
  proactive_suggestions: true

  # — Gorgeous: voice-reactive HUD visuals (frontend reads via /health) —
  reactive_visuals: true
